<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Get in touch with Avyukt Navish Jain.">
    <title>Contact | Avyukt</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav aria-label="Main navigation">
        <button class="theme-toggle" type="button" role="switch" aria-checked="false" aria-label="Dark mode"><span class="switch-track" aria-hidden="true"><span class="switch-thumb"></span></span></button>
        <a href="index.html" class="logo">Avyukt<span>.</span></a>
        <div class="nav-links">
            <a href="index.html">School</a>
            <a href="extracurriculars.html">Extracurriculars</a>
            <a href="achievements.html">Achievements</a>
            <a href="contact.html" class="active" aria-current="page">Contact</a>
        </div>
    </nav>

    <main class="container">
        <div class="section-header">
            <span class="section-badge">Contact</span>
            <h2 class="section-title">Send me a message</h2>
        </div>
        
        <form id="contact-form" action="https://formspree.io/f/mdeoqjyg" method="POST">

            <label class="visually-hidden" for="name">Your name</label>
            <input id="name" type="text" name="name" placeholder="Your name" autocomplete="name" required>
            <label class="visually-hidden" for="email">Your email address</label>
            <input id="email" type="email" name="email" placeholder="Your email address" autocomplete="email" required>
            <label class="visually-hidden" for="subject">Subject</label>
            <input id="subject" type="text" name="subject" placeholder="Subject" required>
            <label class="visually-hidden" for="message">Your message</label>
            <textarea id="message" name="message" rows="7" placeholder="Write your message here" required></textarea>

            <button type="submit" id="submit-button">Send Message</button>
            <p id="form-status" role="status" aria-live="polite" hidden></p>
        </form>
    </main>

    <script>
        const form = document.getElementById('contact-form');
        const button = document.getElementById('submit-button');
        const status = document.getElementById('form-status');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();
            status.hidden = true;
            button.textContent = 'Sending...';
            button.disabled = true;

            const data = new FormData(form);

            try {
                const response = await fetch(form.action, {
                    method: form.method,
                    body: data,
                    headers: {
                        'Accept': 'application/json'
                    }
                });

                if (response.ok) {
                    window.location.href = 'success.html';
                } else {
                    throw new Error('The form service returned an error.');
                }
            } catch (error) {
                status.textContent = 'Your message could not be sent. Please check your connection and try again.';
                status.hidden = false;
                button.textContent = 'Send Message';
                button.disabled = false;
            }
        });
    </script>
</body>
</html>
